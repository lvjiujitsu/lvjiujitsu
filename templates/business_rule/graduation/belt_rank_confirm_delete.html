{% extends "business_rule/lv/modal_frame.html" %}

{% block title %}Excluir faixa — {{ site_name }}{% endblock %}
{% block header_title %}Excluir faixa{% endblock %}

{% block content %}
<p>Confirma excluir <strong>{{ object.display_name }}</strong>? Essa ação não pode ser desfeita.</p>
<form method="post" class="form-actions" style="margin-top:1rem;">
  {% csrf_token %}
  <button type="button" class="btn btn--secondary" data-modal-close>Cancelar</button>
  <button type="submit" class="btn btn--danger">Excluir</button>
</form>
{% endblock %}
