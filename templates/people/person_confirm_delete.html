<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Excluir {{ object.full_name }} — LV Jiu Jitsu</title>
  {% load static %}
  <script>(function(){var t=localStorage.getItem('lv-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':(t==='light'?'light':(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')));})();</script>
  <link rel="stylesheet" href="{% static 'system/css/people/people.css' %}?v=2">
</head>
<body>

  <!-- ─── Topbar ─────────────────────────────────────────────────────────────── -->
  <header class="topbar" role="banner">
    <a class="topbar__brand" href="{% url 'system:home' %}" aria-label="LV Jiu Jitsu — Início">
      <img class="topbar__logo" src="{% static 'system/img/logo-lv-dark.png' %}" alt="LV Jiu Jitsu" width="80" height="30">
    </a>
    <nav class="topbar__actions" aria-label="Ações do usuário">
      <button class="btn-icon" id="theme-toggle" type="button" aria-label="Alternar tema">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <a class="btn-icon" href="{% url 'system:logout' %}" aria-label="Sair do sistema" title="Sair">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </a>
    </nav>
  </header>

  <!-- ─── Conteúdo principal ───────────────────────────────────────────────── -->
  <main class="page" id="main-content">

    <!-- Cabeçalho -->
    <div class="page-header">
      <p class="page-header__eyebrow">
        <a href="{% url 'system:person-detail' pk=object.pk %}">← {{ object.full_name }}</a>
      </p>
    </div>

    <!-- Card de confirmação de exclusão -->
    <div class="delete-confirm" role="alert" aria-labelledby="delete-title" aria-describedby="delete-body">

      <div class="delete-confirm__icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
        </svg>
      </div>

      <h1 class="delete-confirm__title" id="delete-title">Excluir pessoa</h1>

      <p class="delete-confirm__body" id="delete-body">
        Tem certeza que deseja excluir
        <span class="delete-confirm__name">{{ object.full_name }}</span>?<br>
        Esta ação é irreversível e removerá todos os dados associados.
      </p>

      <div class="delete-confirm__actions">
        <a class="btn btn--secondary" href="{% url 'system:person-detail' pk=object.pk %}">
          Cancelar
        </a>
        <form method="post" style="display:inline;">
          {% csrf_token %}
          <button class="btn btn--danger-outline" type="submit">
            Sim, excluir
          </button>
        </form>
      </div>

    </div>

  </main>

  <!-- ─── Scripts ──────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      var toggle = document.getElementById('theme-toggle');
      var sun = document.getElementById('icon-sun');
      var moon = document.getElementById('icon-moon');

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') { sun.removeAttribute('hidden'); moon.setAttribute('hidden', ''); }
        else { moon.removeAttribute('hidden'); sun.setAttribute('hidden', ''); }
      }

      applyTheme(localStorage.getItem('lv-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

      toggle.addEventListener('click', function () {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('lv-theme', next);
        applyTheme(next);
      });
    })();
  </script>

</body>
</html>
