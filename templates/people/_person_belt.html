{% if person.jiu_jitsu_belt %}
<div class="person-belt person-belt--{{ person.jiu_jitsu_belt }}{% if compact %} person-belt--compact{% endif %}" aria-label="Faixa {{ person.get_jiu_jitsu_belt_display }}{% if person.jiu_jitsu_stripes %}, {{ person.jiu_jitsu_stripes }} grau{{ person.jiu_jitsu_stripes|pluralize }}{% endif %}">
  <span class="person-belt__track" aria-hidden="true">
    <span class="person-belt__body"></span>
    <span class="person-belt__tip">
      {% with stripes=person.jiu_jitsu_stripes|default:0 %}
      <span class="person-belt__stripe{% if stripes >= 1 %} is-filled{% endif %}"></span>
      <span class="person-belt__stripe{% if stripes >= 2 %} is-filled{% endif %}"></span>
      <span class="person-belt__stripe{% if stripes >= 3 %} is-filled{% endif %}"></span>
      <span class="person-belt__stripe{% if stripes >= 4 %} is-filled{% endif %}"></span>
      {% endwith %}
    </span>
  </span>
  <span class="sr-only">Faixa {{ person.get_jiu_jitsu_belt_display }}{% if person.jiu_jitsu_stripes %}, {{ person.jiu_jitsu_stripes }} grau{{ person.jiu_jitsu_stripes|pluralize }}{% endif %}</span>
</div>
{% endif %}
