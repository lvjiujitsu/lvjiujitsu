{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block modal_title %}LV Jiu Jitsu{% endblock %}</title>
  <script>(function(){var t=localStorage.getItem('lv-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':(t==='light'?'light':(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')));})();</script>
  <link rel="stylesheet" href="{% static 'system/css/people/people.css' %}?v=4">
  <link rel="stylesheet" href="{% static 'system/css/shared/crud_modal.css' %}?v=2">
  {% block modal_styles %}{% endblock %}
</head>
<body class="modal-frame-body" data-crud-frame-modal="{{ crud_modal_name|default:'' }}">
  <main class="modal-page" id="main-content">

    {% if messages %}
    <div class="system-messages" role="alert" aria-live="assertive">
      {% for message in messages %}
      <div class="system-message system-message--{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}

    {% block modal_content %}{% endblock %}
  </main>

  <script src="{% static 'system/js/shared/crud_frame.js' %}?v=1" defer></script>
  <script src="{% static 'system/js/shared/pt_br_date_inputs.js' %}?v=1" defer></script>
  {% block modal_scripts %}{% endblock %}
</body>
</html>
