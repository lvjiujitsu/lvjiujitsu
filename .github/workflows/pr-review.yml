name: PR Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  static-gates:
    name: Portoes deterministicos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Audit CSS tokens
        run: python scripts/audit_css.py

      - name: Verify no comments or docstrings
        run: python scripts/strip_comments.py

      - name: Validate skills and agents
        run: python scripts/validate_skill_frontmatter.py

      - name: Verify PRD index
        run: python scripts/build_prd_index.py --check

  agent-review:
    name: Revisao pelo agente
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: static-gates

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for API key
        id: guard
        run: echo "enabled=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Skip without API key
        if: steps.guard.outputs.enabled != 'true'
        run: |
          echo "ANTHROPIC_API_KEY nao configurada; revisao pelo agente ignorada."
          echo "Configure o secret para ativar o portao de julgamento."

      - name: Set up Node
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        if: steps.guard.outputs.enabled == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Review the pull request
        if: steps.guard.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          claude -p "Use o subagente lv-agent-pr-review para julgar o Pull Request #${PR_NUMBER} deste repositorio. Aprove ou reprove com justificativa por arquivo e linha." \
            --permission-mode dontAsk \
            --allowedTools "Read,Grep,Glob,Bash(gh *),Bash(git *),Bash(python *)" \
            --output-format json
