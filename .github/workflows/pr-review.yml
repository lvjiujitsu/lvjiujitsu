name: PR Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  static-gates:
    name: Portoes deterministicos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Audit CSS tokens
        run: python scripts/audit_css.py

      - name: Verify no comments or docstrings
        run: python scripts/strip_comments.py

      - name: Validate skills
        run: python scripts/validate_skill_frontmatter.py

      - name: Verify PRD index
        run: python scripts/build_prd_index.py --check
