name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DJANGO_ENVIRONMENT: local
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      ADMIN_SUPERUSER_USERNAME: ci-admin
      ADMIN_SUPERUSER_EMAIL: ci-admin@example.com
      ADMIN_SUPERUSER_PASSWORD: ci-only-password
      SEED_INITIAL_TEACHER_PASSWORD: ci-only-password
      SEED_INITIAL_ADMINISTRATIVE_PASSWORD: ci-only-password
      SEED_TEST_PORTAL_PASSWORD: ci-only-password

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate dependencies
        run: python -m pip check

      - name: Validate skill frontmatter
        run: python scripts/validate_skill_frontmatter.py

      - name: Verify PRD index
        run: python scripts/build_prd_index.py --check

      - name: Django system check
        run: python manage.py check

      - name: Verify migration baseline
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: python manage.py test --verbosity 2
