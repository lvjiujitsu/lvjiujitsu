name: "Copilot Setup Steps"

# Prepara o ambiente Python do repositorio para o agente. Alinhado ao `ci.yml`
# em runner, timeout e versao de Python — o que a entrega usa.
#
# Os passos de navegador e de MCP foram removidos: `playwright` nao consta em
# `requirements.txt`, e o projeto nao o importa, entao `playwright install`
# nunca teve como funcionar; e validar `--help` de pacote npm ou abrir um site
# externo testa o registro npm e a internet, nao este repositorio.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate dependencies
        run: python -m pip check
